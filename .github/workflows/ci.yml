name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      METAADS_CI_PROXY:
        required: false
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy meta_ads_collector/ --ignore-missing-imports
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Regressions, source archive and coverage
        run: python -m pytest tests -m "not integration" --cov=meta_ads_collector --cov-branch --cov-report=xml --junitxml=ci-results/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ci-results/
            coverage.xml
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Isolated wheel regression suite
        run: python scripts/check_distribution.py
      - name: Exact minimum dependency regression suite
        run: python scripts/check_distribution.py --minimum
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-tests
          path: ci-results/
  live-connectivity:
    needs: [quality, test, distribution]
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      METAADS_CI_PROXY: ${{ secrets.METAADS_CI_PROXY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install packaging
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Bounded actual Meta connectivity and field check
        run: python scripts/check_distribution.py --live --preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-connectivity-tests
          path: ci-results/
  live-meta:
    needs: [live-connectivity]
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      METAADS_CI_PROXY: ${{ secrets.METAADS_CI_PROXY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install packaging
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Full actual Meta integration suite
        run: python scripts/check_distribution.py --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-meta-tests
          path: ci-results/
